# If you want to use a Docker Volume :
#   Uncomment the line "db_data:/var/lib/mysql" and comment the line "./.server_files/AAEmu.Database/mysql:/var/lib/mysql" that are in the db services
#   Also uncomment the two volumes line at the end... This is useful if you use WSL Shell on Windows to launch the compose file.
# Local development without containers for the servers: `cd rust && cargo xtask dev` starts only the
# `db` service and runs the login and game servers natively.
services:
 
    db:
        image: mysql:8.0.36
        restart: unless-stopped
        # command: --default_authentication_plugin=mysql_native_password
        volumes:
            - ./SQL/aaemu_login.sql:/docker-entrypoint-initdb.d/aaemu_login.sql
            - ./SQL/aaemu_game.sql:/docker-entrypoint-initdb.d/aaemu_game.sql
            - ./.server_files/AAEmu.Database/mysql:/var/lib/mysql
            # - db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - ${DB_PORT:-3306}:3306
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD}" ]
            interval: 5s
            timeout: 5s
            retries: 20

    adminer:
        image: adminer
        restart: unless-stopped
        environment:
            ADMINER_DEFAULT_DB_DRIVER: mysql
            ADMINER_DEFAULT_DB_HOST: db
            ADMINER_DESIGN: nette
        ports:
            - 8080:8080
        depends_on:
            db:
              condition: service_healthy

    login:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: login
            args:
                - BUILD_PROFILE=${BUILD_PROFILE:-release}
        image: aaemu-login:${PROJECT_VERSION_PREFIX}-${PROJECT_VERSION_SUFFIX}
        restart: unless-stopped
        volumes:
          - "./.server_files/AAEmu.Login/Config.json:/app/Config.json:ro"
        environment:
            RUST_LOG: ${RUST_LOG:-info}
            GameServers__0__Id: 1
            GameServers__0__Name: AAEmu.Game
            GameServers__0__Host: 127.0.0.1
            GameServers__0__Port: 1239
        ports:
            - 1237:1237
        develop:
            watch:
                - path: ./rust
                  action: rebuild
                  ignore:
                      - target/
        healthcheck:
            # internal port (game server registration) accepts connections
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1234' || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
        depends_on:
            db:
              condition: service_healthy

    game:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: game
            args:
                - BUILD_PROFILE=${BUILD_PROFILE:-release}
        image: aaemu-game:${PROJECT_VERSION_PREFIX}-${PROJECT_VERSION_SUFFIX}
        restart: unless-stopped
        volumes:
          - "./.server_files/AAEmu.Game/ClientData:/app/ClientData:ro"
          - "./.server_files/AAEmu.Game/Data:/app/Data:ro"
          - "./.server_files/AAEmu.Game/Configurations:/app/Configurations:ro"
          - "./.server_files/AAEmu.Game/Config.json:/app/Config.json:ro"
        environment:
            RUST_LOG: ${RUST_LOG:-info}
        ports:
            - 1239:1239
            - 1250:1250
        develop:
            watch:
                - path: ./rust
                  action: rebuild
                  ignore:
                      - target/
        healthcheck:
            # client port accepts connections (all game data loaded)
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1239' || exit 1"]
            interval: 5s
            timeout: 5s
            start_period: 10m
            retries: 20
        depends_on:
            db:
              condition: service_healthy
            login:
              condition: service_healthy

