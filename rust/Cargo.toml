[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
aaemu-commons = { path = "crates/aaemu-commons" }
aaemu-physics = { path = "crates/aaemu-physics" }
anyhow = "1"
thiserror = "1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "macros", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
# Added for aaemu-login
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
base64 = "0.22"
subtle = "2"
regex = "1"
roxmltree = "0.20"
# Added for aaemu-game (read-only access to the client compact.sqlite3; 0.32 shares libsqlite3-sys 0.30 with sqlx 0.8)
rusqlite = { version = "0.32", features = ["bundled"] }
# Added for aaemu-game services (WebApi HTTP server, Discord bot)
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
twilight-gateway = { version = "0.16", default-features = false, features = ["rustls-ring", "rustls-webpki-roots", "twilight-http"] }
twilight-http = { version = "0.16", default-features = false, features = ["rustls-ring", "rustls-webpki-roots"] }
twilight-model = "0.16"
# aaemu-testclient: inflating the level-4 (DD04) compressed game packets
miniz_oxide = "0.8"

# aaemu-login: keep password hashing (PBKDF2 @ 600k iterations, sha256_crypt) usable in debug
# builds and tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3

# Line tables in release builds (into the .pdb on Windows), so panic backtraces and the native
# crash reports in Logs/Crash.log name file:line. Code generation is unchanged.
[profile.release]
debug = "line-tables-only"

# Fast-to-build optimised profile for local live testing (`Scripts/live-stack.sh build`):
# light optimisation, incremental and many codegen units, so rebuilding aaemu-game after an
# edit takes a fraction of a full release build. Not for production: use `release`.
[profile.live]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256
