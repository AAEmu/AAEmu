name: Build & Unit Test

on:
  push:
    branches: [master, develop]
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - "*" # matches every branch
      - "*/*" # matches every branch containing a single '/'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  sc-ratchet:
    name: S->C coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Gap lists (opcodes without a Rust type, packets never sent) may only shrink; see the
      # header of rust/tools/opcode_coverage/sc_usage.py. Pure text analysis, no network or data.
      - name: Check baseline
        run: python3 tools/opcode_coverage/sc_usage.py --check
      - name: Ratchet logic tests
        working-directory: rust/tools/opcode_coverage
        run: python3 -m unittest test_sc_usage

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Successor of the C# "Scripts Compile" step (the GM scripts are compiled into the binary).
      - name: Scripts compile check
        run: cargo run --locked -p aaemu-game -- compiler-check
      # Unit + flow tests of every crate (incl. the aaemu-testclient unit tests). Tests that need a
      # live MySQL (AAEMU_TEST_MYSQL) or the client data (AAEMU_COMPACT_DB, AAEMU_GAME_PAK) are
      # ignored / skipped here; run them locally (see rust/LIVE-TESTING.md).
      - name: Test
        run: cargo test --workspace --locked
      - name: Shell scripts syntax
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          for f in Scripts/*.sh rust/crates/aaemu-testclient/scripts/*.sh .agents/skills/aaemu-setup/scripts/*.sh; do
            bash -n "$f" || exit 1
          done

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: rust/lcov.info
          format: lcov
