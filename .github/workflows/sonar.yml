name: Sonar Build
on:
  push:
    branches: [develop, master]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Clippy findings (JSON) and LCOV coverage are imported by the scanner.
      - name: Clippy report
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked --message-format=json > clippy-report.json || true
      - name: Coverage
        working-directory: rust
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=aaemulator_aaemu
            -Dsonar.organization=aaemulator
            -Dsonar.sources=rust/crates
            -Dsonar.exclusions=**/target/**,rust/crates/aaemu-game/app/**
            -Dsonar.rust.clippy.reportPaths=rust/clippy-report.json
            -Dsonar.rust.lcov.reportPaths=rust/lcov.info
